<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If else</title>
</head>
<body>
    <input type="text" id="num1" placeholder="Enter first number"><br><br>
    <input type="text" id="num2" placeholder="Enter second number"><br><br>
    <button onclick="operations('add')">Add</button>
    <button onclick="operations('sub')">Sub</button>
    <button onclick="operations('mul')">Mul</button>        
    <p id="result">  </p>
    <script>
        function operations(operator){
            let a=parseInt(document.getElementById("num1").value);
            let b=parseInt(document.getElementById("num2").value);  
            let res;
            if(operator=="add"){
                res=a+b;
            }else if(operator=='sub'){
                res=a-b;
            }else if(operator=='mul'){
                res=a*b;    
              }else{
                res="Invalid operator";
                return;}
            document.getElementById("result").innerHTML=`${a} ${operator} ${b} = ${res}`;
              }
    </script>
</body>
</html>

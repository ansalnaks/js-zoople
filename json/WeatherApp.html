<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather App</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: linear-gradient(to right, #4a677f, #00f2fe);
            color: white;
        }

        .container {
            margin-top: 50px;
        }

        input {
            padding: 10px;
            width: 200px;
            border: none;
            border-radius: 5px;
        }

        button {
            padding: 10px;
            border: none;
            background: #333;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .weather-box {
            margin-top: 20px;
            padding: 20px;
            background: rgba(234, 230, 230, 0.3);
            display: inline-block;
            border-radius: 10px;
        }

        img {
            width: 100px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌦️ Weather App</h1>

        <input type="text" id="city" placeholder="Enter city name">
        <button onclick="getWeather()">Search</button>

        <div class="weather-box" id="weatherBox" style="display:none;">
            <h2 id="cityName"></h2>
            <img id="icon">
            <h3 id="temp"></h3>
            <p id="desc"></p>
            <p id="humidity"></p>
            <p id="wind"></p>
        </div>
    </div>

    <script>
        async function getWeather() {
            const city = document.getElementById("city").value;
            const apiKey = "bd0cff31d68d01043cadefca571cf439"; 

            const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.cod === "404") {
                    alert("City not found");
                    return;
                }

                document.getElementById("weatherBox").style.display = "block";

                document.getElementById("cityName").innerText = data.name;
                document.getElementById("temp").innerText = `🌡️ ${data.main.temp} ℃`;
                document.getElementById("desc").innerText = `☁️ ${data.weather[0].description}`;
                document.getElementById("humidity").innerText = `💧 Humidity: ${data.main.humidity}%`;
                document.getElementById("wind").innerText = `🌬️ Wind: ${data.wind.speed} m/s`;

                const iconCode = data.weather[0].icon;
                document.getElementById("icon").src =
                    `https://openweathermap.org/img/wn/${iconCode}@2x.png`;

            } catch (error) {
                console.log(error);
                alert("Error fetching data");
            }
        }
    </script>

</body>
</html>

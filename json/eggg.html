<!DOCTYPE html>
<html lang="en">
<head>
    <title>Watch Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body{
            background:#f1f1f1;
        }
        .main{

            width:80%;
            height:566px;
            background:white;
            margin:auto;
            margin-top:50px;
            border-radius:20px;
            box-shadow:2px 3px 10px gray;
        }
        .container{
            display:flex;
            gap:50px;
            padding:30px;
        }
        .sub{
            width:40%;
            height:400px;
        }
        .sub img{
            width:100%;
            height:100%;
            border-radius:20px;
        }
        .sub1{
            width:50%;
            height:400px;
            margin-top:30px;
        }
        .sub1 h3{

            color:blue;
        }
        .sub1 h1{
            font-size:40px;
        }
        .sub1 h2{

            font-size:35px;
        }
        .sub1 p{
            font-size:20px;
            color:gray;
        }
        button{

            width:180px;
            height:50px;
            background:blue;
            color:white;
            border:none;
            border-radius:10px;
            font-size:20px;
            font-weight:bold;
        }
        .bottom{

            width:100%;
            height:80px;
            background:rgb(201, 233, 200);
            position:sticky;
            bottom:0px;
            border-radius:0 0 20px 20px;
        }
        ul{
            list-style-type: none;
            display:flex ;
            justify-content: space-around;
            
            
        }
        ul li{
            margin: 26px;
        }

        /* .box1{
            position:absolute;
            left:80px;
            top:25px;
            font-size:25px;
        }
        .box2{
            position:absolute;
            left:420px;
            top:25px;
            font-size:25px;
        }
        .box3{
            position:absolute;
            right:80px;
            top:25px;
            font-size:25px;
        } */
    </style>
</head>
<body>
    <div class="main">
        <div class="container">
            <div class="sub">
                <img src="watch.jpg">
            </div>
            <div class="sub1">
                <h3>WATCHES</h3>
                <h1>Premium Analog Watch</h1>
                <p>******(128 reviews)</p>
                <h2>₹2,499</h2>
                <p>
                    Stylish analog watch with a premium leather strap and water resistant design.
                </p>
                <button>Add to Cart</button>
            </div>
        </div>
        <div class="bottom">
                <ul>
                    <li> 
                        <i class="fa-solid fa-circle-check" style="color: green;"></i>
                        <!-- <img width="30px" height="30px" style="vertical-align: middle;opacity:0.7;" src="https://img.freepik.com/premium-vector/green-checkmark-approval-icon-vector_1318489-5392.jpg" alt="Free Delivery"> -->
                         Free Delivery
                        </li>
                    <li>|</li>
                    <li>30 Days Return</li>
                    <li>|</li>
                    <li> 1 Year Warranty</li>
                </ul>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Pokemon Viewer</title>
</head>
<body>

    <h2>Pokemon Viewer</h2>

    <input type="text" id="pokemonName" placeholder="Enter pokemon name">
    <button onclick="fetchPokemon()">Search</button>

    <h3 id="name"></h3>
    <img id="image" width="200">
    <ul id="list"> </ul>

    <script>
        async function fetchPokemon() {
            try {
                let name = document.getElementById("pokemonName").value.toLowerCase();
                const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${name}`);

                if (!response.ok) {
                    throw new Error("Pokemon not found");
                }
                const data = await response.json();
                document.getElementById("name").innerText = data.name;
                document.getElementById("image").src = data.sprites.front_shiny;



                
                const response1 = await fetch(`https://pokeapi.co/api/v2/pokemon/`);
                const data1=await response1.json()
                list.innerHTML = "  ";

                data1.results.forEach(pokemon => {
                    let li = document.createElement("li");
                    li.innerText = pokemon.name;
                    list.appendChild(li);
                });

            } catch (err) {
                alert(err.message);
            }
        }
    </script>

</body>
</html>
